name: Android compile check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/android-check.yml"
  push:
    branches:
      - "android/greetings-apk"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/android-check.yml"

permissions:
  contents: write

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Android arm64 Rust target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018

      - name: Install Rust toolchain and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Ensure Android Rust target is installed
        run: rustup target add aarch64-linux-android

      - name: Configure Android NDK compiler
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Check Android library
        id: android_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo check --lib --target aarch64-linux-android --features android-game-activity 2>&1 | tee /tmp/android-check.log

      - name: Save compiler diagnostics for review
        if: steps.android_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'android/last-build-errors.txt';
            const body = fs.readFileSync('/tmp/android-check.log', 'utf8');
            const encoded = Buffer.from(body).toString('base64');
            let sha;
            try {
              const old = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path,
                ref: context.ref.replace('refs/heads/', '')
              });
              sha = old.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path,
              message: 'Record Android compile diagnostics',
              content: encoded,
              branch: context.ref.replace('refs/heads/', ''),
              ...(sha ? { sha } : {})
            });

      - name: Fail when Android library does not compile
        if: steps.android_check.outcome == 'failure'
        run: exit 1
